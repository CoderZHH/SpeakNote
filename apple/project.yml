name: SpeakNote
options:
  minimumXcodeGenVersion: 2.44.0
  xcodeVersion: '26.0'
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
packages:
  WorkBenchKit:
    path: Packages/WorkBenchKit
settings:
  base:
    SWIFT_VERSION: '6.2'
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.2.0
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
targetTemplates:
  Host:
    type: application
    settings:
      base:
        PRODUCT_NAME: WorkBench
    sources:
      - Hosts
    dependencies:
      - package: WorkBenchKit
    info:
      path: Configuration/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: WorkBench
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryUsageDescription: 选择截图或备注附件
targets:
  WorkBenchMac:
    productName: SpeakNote
    templates: [Host]
    platform: macOS
    info:
      path: Configuration/WorkBenchMac-Info.plist
      properties:
        CFBundleDisplayName: SpeakNote
        CFBundleDevelopmentRegion: en
        LSApplicationCategoryType: public.app-category.productivity
    sources:
      - path: Resources/Mac.xcassets
      - path: Resources/MacLocalization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.coderzhh.workbenchpreview
        PRODUCT_NAME: SpeakNote
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
  WorkBenchIOS:
    productName: WorkBench
    templates: [Host]
    platform: iOS
    dependencies:
      - target: WorkBenchFocusActivity
    info:
      path: Configuration/WorkBenchIOS-Info.plist
      properties:
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: io.github.coderzhh.workbenchpreview.focus
            CFBundleURLSchemes: [workbench-preview]
    sources:
      - path: Resources/iOS.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.coderzhh.workbenchpreview.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  WorkBenchFocusActivity:
    type: app-extension
    platform: iOS
    sources: [FocusActivity]
    dependencies:
      - package: WorkBenchKit
        product: WorkBenchActivity
    info:
      path: Configuration/WorkBenchFocusActivity-Info.plist
      properties:
        CFBundleDisplayName: WorkBench 专注
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: WorkBenchFocusActivity
        PRODUCT_BUNDLE_IDENTIFIER: io.github.coderzhh.workbenchpreview.ios.focusactivity
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
  PhotoAssistant:
    templates: [Host]
    platform: iOS
    info:
      path: Configuration/PhotoAssistant-Info.plist
      properties:
        CFBundleDisplayName: 拍照助手
    sources:
      - path: Resources/iOS.xcassets
    settings:
      base:
        PRODUCT_NAME: PhotoAssistant
        PRODUCT_BUNDLE_IDENTIFIER: io.github.coderzhh.workbenchpreview.photo
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PHOTO_ASSISTANT
        INFOPLIST_KEY_CFBundleDisplayName: 拍照助手
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  WorkBenchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: WorkBenchIOS
      - target: PhotoAssistant
    settings:
      base:
        PRODUCT_NAME: WorkBenchUITests
        PRODUCT_BUNDLE_IDENTIFIER: io.github.coderzhh.workbenchpreview.native-uitests
        TEST_TARGET_NAME: WorkBenchIOS
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WorkBenchMac:
    build:
      targets:
        WorkBenchMac: all
    run:
      config: Debug
      executable: WorkBenchMac
  WorkBenchIOS:
    build:
      targets:
        WorkBenchIOS: all
        PhotoAssistant: [test]
        WorkBenchUITests: [test]
    run:
      config: Debug
      executable: WorkBenchIOS
    test:
      config: Debug
      macroExpansion: WorkBenchIOS
      targets: [WorkBenchUITests]
  PhotoAssistant:
    build:
      targets:
        PhotoAssistant: all
    run:
      config: Debug
      executable: PhotoAssistant
